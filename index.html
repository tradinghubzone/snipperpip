<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US500 MT5 Synced Bot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f17;
      font-family: 'Inter', sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 16px; color: #eef2ff;
    }
    .bot-card {
      max-width: 880px; width: 100%;
      background: rgba(18, 25, 40, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(78, 110, 180, 0.25);
      border-radius: 36px; padding: 28px 24px;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.8);
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo i { font-size: 26px; color: #4f8cff; }
    .logo h1 {
      font-weight: 600; font-size: 1.6rem; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, #b7c9ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .badge {
      background: #1a2842; padding: 6px 16px; border-radius: 100px;
      font-size: 0.75rem; font-weight: 600; color: #94b0ff; border: 1px solid #2e4170;
    }
    .price-block {
      display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
      margin-bottom: 14px; background: #0b1221; padding: 14px 20px;
      border-radius: 28px; border: 1px solid #1e2d4b;
    }
    .symbol { display: flex; align-items: center; gap: 10px; }
    .symbol i { color: #ffd966; }
    .symbol span { font-weight: 700; font-size: 1.5rem; }
    .current-price { display: flex; align-items: baseline; gap: 12px; }
    .price-value { font-weight: 700; font-size: 2.2rem; color: #ffffff; }
    .change { font-weight: 600; font-size: 0.9rem; padding: 4px 10px; border-radius: 40px; }
    
    /* Snipper Card */
    .snipper-card {
      background: linear-gradient(145deg, #101b2e, #0b1322);
      border-radius: 28px; padding: 22px; margin: 20px 0;
      border: 1px solid #26416b; box-shadow: 0 8px 0 #05080f;
      transition: border-color 0.3s;
    }
    .snipper-card.locked { border-color: #ffb347; }
    .snipper-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .snipper-header i { font-size: 1.3rem; color: #4f8cff; background: #14233e; padding: 10px; border-radius: 16px; }
    .snipper-header h2 { font-size: 1.25rem; font-weight: 600; }
    .status-badge {
      margin-left: auto; font-size: 0.7rem; font-weight: 700;
      padding: 4px 10px; border-radius: 40px; text-transform: uppercase;
    }
    .status-badge.scanning { background: #1f3456; color: #99b8ff; }
    .status-badge.locked { background: rgba(255, 179, 71, 0.2); color: #ffb347; border: 1px solid #ffb347; }
    .status-badge.win { background: rgba(45, 219, 140, 0.2); color: #2ddb8c; border: 1px solid #2ddb8c; }
    .status-badge.loss { background: rgba(255, 94, 124, 0.2); color: #ff5e7c; border: 1px solid #ff5e7c; }

    .entry-direction {
      display: flex; align-items: center; justify-content: space-between;
      background: #0b1322; padding: 12px 18px; border-radius: 60px;
      margin-bottom: 22px; border: 1px solid #1f375a;
    }
    .direction-badge { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
    .long { color: #2ddb8c; }
    .short { color: #ff5e7c; }
    .entry-price { font-weight: 700; font-size: 1.5rem; background: #00000033; padding: 6px 16px; border-radius: 40px; }

    .sl-tp-row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .sl-tp-item { flex: 1 1 140px; background: #0d1525; border-radius: 20px; padding: 14px 16px; border-left: 4px solid; }
    .sl-tp-item.sl { border-left-color: #ff5e7c; }
    .sl-tp-item.tp { border-left-color: #2ddb8c; }
    .sl-tp-label { font-size: 0.75rem; color: #7f9bcf; font-weight: 600; margin-bottom: 6px; }
    .sl-tp-value { font-size: 1.4rem; font-weight: 700; }

    .countdown-box {
      display: flex; align-items: center; justify-content: space-between;
      background: #070e19; border-radius: 40px; padding: 12px 22px;
      border: 1px solid #233b60; margin: 16px 0 8px;
    }
    .countdown-label { display: flex; align-items: center; gap: 10px; color: #9bb3e0; font-weight: 500; }
    .timer { font-weight: 700; font-size: 1.8rem; color: #ffffff; background: #1b2b46; padding: 6px 18px; border-radius: 60px; }
    .progress-bar { height: 4px; background: #1a2a42; border-radius: 10px; margin: 6px 0 18px; overflow: hidden; }
    .progress-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #4f8cff, #9f7aff); transition: width 1s linear; }

    .action-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .refresh-btn {
      background: #1e2f4e; border: 1px solid #31538b; color: white;
      padding: 12px 28px; border-radius: 100px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #141c2b; border-color: #1f2937; }
    .refresh-btn:not(:disabled):hover { background: #27436e; border-color: #4f8cff; }

    /* Simulator controls for testing */
    .simulator-box {
      margin-top: 20px; padding: 15px; background: #1a1205; border: 1px dashed #ffb347;
      border-radius: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }
    .sim-btn { background: #33260d; color: #ffd966; border: 1px solid #664d1a; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem;}
    .sim-btn:hover { background: #4d3a14; }
  </style>
</head>
<body>
  <div class="bot-card">
    <div class="header">
      <div class="logo"><i class="fas fa-robot"></i><h1>SNIPER BOT</h1></div>
      <div class="badge">US500 • H1 Synced</div>
    </div>

    <!-- Live Price -->
    <div class="price-block">
      <div class="symbol"><i class="fas fa-chart-line"></i><span>US500</span></div>
      <div class="current-price">
        <span class="price-value" id="livePrice">7,548.81</span>
        <span class="change" id="priceChange">+0.00%</span>
      </div>
    </div>

    <!-- Snipper Card -->
    <div class="snipper-card" id="snipperCard">
      <div class="snipper-header">
        <i class="fas fa-crosshairs"></i>
        <h2>SNIPPER ENTRY</h2>
        <span class="status-badge scanning" id="statusBadge">SCANNING...</span>
      </div>

      <div class="entry-direction">
        <div class="direction-badge" id="directionBadge">
          <i class="fas fa-minus"></i><span id="directionText">WAITING</span>
        </div>
        <div class="entry-price" id="entryPrice">--</div>
      </div>

      <div class="sl-tp-row">
        <div class="sl-tp-item sl">
          <div class="sl-tp-label"><i class="fas fa-shield-alt"></i> STOP LOSS</div>
          <div class="sl-tp-value" id="slValue">--</div>
        </div>
        <div class="sl-tp-item tp">
          <div class="sl-tp-label"><i class="fas fa-bullseye"></i> TAKE PROFIT</div>
          <div class="sl-tp-value" id="tpValue">--</div>
        </div>
      </div>

      <!-- MT5 Countdown -->
      <div class="countdown-box">
        <div class="countdown-label"><i class="fas fa-hourglass-half"></i><span>MT5 Candle Close</span></div>
        <div class="timer" id="timerDisplay">00:00:00</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 100%;"></div></div>

      <div class="action-row">
        <button class="refresh-btn" id="refreshBtn" disabled>
          <i class="fas fa-lock"></i> LOCKED
        </button>
      </div>
    </div>

    <!-- Testing Tool (Hidden in real production) -->
    <div class="simulator-box">
      <div><i class="fas fa-vial"></i> <strong>Test Tool:</strong> Move price to hit SL/TP</div>
      <div style="display:flex; gap: 8px;">
        <button class="sim-btn" id="simWin">Hit TP</button>
        <button class="sim-btn" id="simLoss">Hit SL</button>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    const PIP_VALUE = 0.1;          // 1 pip = 0.1 points for US500
    const TP_PIPS = 200;            // 200 pips
    const SL_PIPS = 200;            // 200 pips
    
    // We start at the price from your MT5 screenshot
    let currentPrice = 7548.81;     
    let basePrice = 7548.81;

    // State
    let isLocked = false;
    let direction = null;
    let entryPrice = 0;
    let slPrice = 0;
    let tpPrice = 0;
    
    let countdownInterval = null;
    let priceTickInterval = null;

    // DOM Elements
    const elLivePrice = document.getElementById('livePrice');
    const elPriceChange = document.getElementById('priceChange');
    const elSnipperCard = document.getElementById('snipperCard');
    const elStatusBadge = document.getElementById('statusBadge');
    const elDirectionBadge = document.getElementById('directionBadge');
    const elDirectionText = document.getElementById('directionText');
    const elEntryPrice = document.getElementById('entryPrice');
    const elSlValue = document.getElementById('slValue');
    const elTpValue = document.getElementById('tpValue');
    const elTimer = document.getElementById('timerDisplay');
    const elProgress = document.getElementById('progressFill');
    const elRefreshBtn = document.getElementById('refreshBtn');

    // --- FORMATTING ---
    const formatPrice = (val) => val.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

    // --- MT5 TIME SYNC LOGIC ---
    function updateMT5Countdown() {
      const now = new Date();
      
      // Calculate time until the NEXT H1 candle (top of the hour)
      // e.g., if it's 21:25, next candle is at 22:00
      const nextHour = new Date(now);
      nextHour.setHours(now.getHours() + 1, 0, 0, 0); 
      
      const diffMs = nextHour - now;
      const totalSeconds = Math.floor(diffMs / 1000);
      
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      // Update Display
      elTimer.textContent = 
        `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      
      // Update Progress Bar (3600 seconds = 100%)
      const percent = (totalSeconds / 3600) * 100;
      elProgress.style.width = `${percent}%`;

      // If new candle forms (00:00:00) AND bot is not locked, trigger scan
      if (totalSeconds === 0 && !isLocked) {
        generateNewSignal();
      }
    }

    // --- SCANNING & LOCKING LOGIC ---
    function generateNewSignal() {
      if (isLocked) return;

      // Visual feedback that it's scanning
      elStatusBadge.className = 'status-badge scanning';
      elStatusBadge.textContent = 'SCANNING...';
      elRefreshBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> SCANNING...';
      elRefreshBtn.disabled = true;

      setTimeout(() => {
        // 1. Lock the bot
        isLocked = true;
        
        // 2. Generate random direction
        direction = Math.random() > 0.5 ? 'LONG' : 'SHORT';
        entryPrice = currentPrice;

        // 3. Calculate SL & TP
        if (direction === 'LONG') {
          slPrice = entryPrice - (SL_PIPS * PIP_VALUE);
          tpPrice = entryPrice + (TP_PIPS * PIP_VALUE);
          elDirectionBadge.innerHTML = `<i class="fas fa-arrow-up long"></i><span class="long">LONG</span>`;
        } else {
          slPrice = entryPrice + (SL_PIPS * PIP_VALUE);
          tpPrice = entryPrice - (TP_PIPS * PIP_VALUE);
          elDirectionBadge.innerHTML = `<i class="fas fa-arrow-down short"></i><span class="short">SHORT</span>`;
        }

        // 4. Update UI
        elEntryPrice.textContent = formatPrice(entryPrice);
        elSlValue.innerHTML = `${formatPrice(slPrice)} <span style="font-size:0.8rem;color:#8199c7">(${SL_PIPS} pips)</span>`;
        elTpValue.innerHTML = `${formatPrice(tpPrice)} <span style="font-size:0.8rem;color:#8199c7">(${TP_PIPS} pips)</span>`;
        
        elSnipperCard.classList.add('locked');
        elStatusBadge.className = 'status-badge locked';
        elStatusBadge.textContent = 'TRADE ACTIVE';
        
        elRefreshBtn.innerHTML = '<i class="fas fa-lock"></i> LOCKED UNTIL SL/TP';
        elRefreshBtn.disabled = true;

        // Start monitoring price for SL/TP
        monitorPriceForExit();

      }, 1200); // 1.2s simulated AI scan delay
    }

    function monitorPriceForExit() {
      if (!isLocked) return;

      let isHit = false;
      let hitType = '';

      if (direction === 'LONG') {
        if (currentPrice >= tpPrice) { isHit = true; hitType = 'WIN'; }
        if (currentPrice <= slPrice) { isHit = true; hitType = 'LOSS'; }
      } else if (direction === 'SHORT') {
        if (currentPrice <= tpPrice) { isHit = true; hitType = 'WIN'; }
        if (currentPrice >= slPrice) { isHit = true; hitType = 'LOSS'; }
      }

      if (isHit) {
        unlockBot(hitType);
      }
    }

    function unlockBot(result) {
      isLocked = false;
      
      if (result === 'WIN') {
        elStatusBadge.className = 'status-badge win';
        elStatusBadge.textContent = 'TP HIT 🎯';
        elSnipperCard.style.borderColor = '#2ddb8c';
      } else {
        elStatusBadge.className = 'status-badge loss';
        elStatusBadge.textContent = 'SL HIT 🛑';
        elSnipperCard.style.borderColor = '#ff5e7c';
      }

      // Reset Card visuals
      elSnipperCard.classList.remove('locked');
      
      // Unlock Button
      elRefreshBtn.innerHTML = '<i class="fas fa-sync-alt"></i> SCAN AGAIN';
      elRefreshBtn.disabled = false;

      // Clear active trade visuals after a delay
      setTimeout(() => {
        if(!isLocked) {
          elSnipperCard.style.borderColor = '#26416b';
          elStatusBadge.className = 'status-badge scanning';
          elStatusBadge.textContent = 'READY TO SCAN';
        }
      }, 4000);
    }

    // --- PRICE SIMULATOR ---
    function simulatePriceTick() {
      // Simulate small market fluctuations
      const tick = (Math.random() - 0.5) * 0.8;
      currentPrice = currentPrice + tick;
      
      // Update UI
      elLivePrice.textContent = formatPrice(currentPrice);
      
      const changePercent = ((currentPrice - basePrice) / basePrice * 100).toFixed(2);
      elPriceChange.textContent = (changePercent >= 0 ? '+' : '') + changePercent + '%';
      elPriceChange.style.color = changePercent >= 0 ? '#41d98d' : '#ff5e7c';
      elPriceChange.style.background = changePercent >= 0 ? 'rgba(0, 200, 120, 0.15)' : 'rgba(255, 94, 124, 0.15)';

      // Check if we hit SL/TP
      if (isLocked) {
        monitorPriceForExit();
      }
    }

    // --- EVENT LISTENERS ---
    elRefreshBtn.addEventListener('click', generateNewSignal);

    // Test Tool buttons (to easily test SL/TP hits)
    document.getElementById('simWin').addEventListener('click', () => {
      if(!isLocked) return;
      currentPrice = tpPrice;
      simulatePriceTick();
    });

    document.getElementById('simLoss').addEventListener('click', () => {
      if(!isLocked) return;
      currentPrice = slPrice;
      simulatePriceTick();
    });

    // --- INITIALIZATION ---
    function init() {
      elLivePrice.textContent = formatPrice(currentPrice);
      
      // Update countdown every second
      updateMT5Countdown();
      countdownInterval = setInterval(updateMT5Countdown, 1000);

      // Simulate price movement every 800ms
      priceTickInterval = setInterval(simulatePriceTick, 800);
    }

    init();
  </script>
</body>
</html>
